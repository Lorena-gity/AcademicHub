<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- parte do esqueleto padrão do html -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- importando fontes do google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <!-- conectando css e js ao html -->
    <link rel="stylesheet" href="style/style.css" />
    <script src="script/script.js" defer></script>
    <!-- "titulo" da página -->
    <title>Academic Hub</title>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>Academic Hub</h1>
            <p>Sua plataforma de curadoria e revisão espaçada</p>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="bnt-primary" aria-label="Alternar Tema Escuro">Modo Claro</button>
        </div>
        </header>
        <main class = "container">
            <section class = "search-section" aria-label="Pesquisar">
                <div class = "search-container">
                    <input = type="text" placeholder="Buscar por assunto" aria-label="Campo de Pesquisa"/>
                </div>
                </section>
                <article class = "flashcard">
                    <span class = "flashcard-category">Arquitetura CSS</span>
                    <h2 class = "flashcard-question">Qual é a função do Flexblox no CSS?</h2>
                    <button class = "bnt-primary" arial-label = "Mostrar resposta">Mostrar resposta</button>
                </article>
        </main>
    </body>
</html>
