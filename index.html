<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style/style.css">
    <title>Academic Hub</title>
</head>
<body>
    <main clas = "container">
        <header>
            <h1>Academic Hub Flashcards</h1>
            <p>Sua plataforma de curadoria e revisão espaçada</p>
        </header>
        <section class = "search-section" aria-label="Pesquisar">
            <div class = "search-container">
                <input onkeyup="searchFlashcards(event)" type+"text" placeholder="Buscar por assunto" aria-label="Campo de Pesquisa" >
            </div>
            </section>
            <article class = "flashcard">
                <span class = "flashcard-category">Arquitetura CSS</span>
                <h2 class = "flashcard-question">Qual é a função do Flexblox no CSS?</h2>
                <button onclick="showResult()" class = "bnt-primary" arial-label = "Mostrar resposta">Mostrar resposta</button>
            </article>
            <section id="result"></section>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
